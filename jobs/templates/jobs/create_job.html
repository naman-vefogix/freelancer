{% extends 'base.html' %}
{% block content %}
<div class="page">
  <a href="{% url 'client_dashboard' %}" class="btn">← Back</a>
  <h1 class="page-title">Post a job</h1>
  <div class="card">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary">Post job</button>
    </form>
  </div>
</div>
{% endblock %}
