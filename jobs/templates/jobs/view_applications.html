<h1>View application on jobs</h1>

<h2>Applications for {{ job.title }}</h2>
<ul>
  {% for app in applications %}
    <li>
      {{ app.freelancer.username }} applied on {{ app.applied_at }}<br>
      <em>{{ app.cover_letter }}</em>
    </li>
  {% empty %}
    <li>No applications yet.</li>
  {% endfor %}
</ul>
