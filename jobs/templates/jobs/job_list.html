
{% extends 'base.html' %}
{% block content %}
<div class="page">
  <h1 class="page-title">All jobs</h1>
  <div class="card">
    {% for job in jobs %}
      <div class="job-item">
        <div>
          <p class="job-title">{{ job.title }}</p>
          <p class="job-meta">Posted {{ job.created_at }}</p>
        </div>
        <a href="{% url 'apply_job' job.id %}" class="btn">Apply</a>
      </div>
    {% empty %}
      <p class="empty">No jobs available at the moment.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
