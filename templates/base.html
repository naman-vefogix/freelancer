<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freelancer Marketplace</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      line-height: 1.6;
    }

    .page {
      max-width: 700px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .page-title {
      font-size: 22px;
      font-weight: 500;
      margin-bottom: 1.5rem;
    }

    .page-subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 1.5rem;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #e5e5e5;
    }

    .nav-brand {
      font-size: 16px;
      font-weight: 500;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1rem;
    }

    .job-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .job-item:last-child { border-bottom: none; }

    .job-title { font-weight: 500; font-size: 15px; }

    .job-meta { font-size: 12px; color: #888; margin-top: 2px; }

    .app-item {
      padding: 1rem 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .app-item:last-child { border-bottom: none; }

    .cover-letter {
      font-size: 13px;
      color: #555;
      font-style: italic;
      margin-top: 4px;
    }

    .empty {
      color: #888;
      font-size: 14px;
      padding: 1rem 0;
    }

    .section-label {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #999;
      margin-bottom: 0.75rem;
    }

    .spacer { height: 2rem; }

    .notif-count {
      background: #e24b4a;
      color: #fff;
      font-size: 11px;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 500;
      margin-left: 4px;
    }

    /* buttons */
    .btn {
      display: inline-block;
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid #ddd;
      background: transparent;
      color: #1a1a1a;
      text-decoration: none;
    }

    .btn:hover { background: #f5f5f5; }

    .btn-primary {
      background: #1a1a1a;
      color: #fff;
      border-color: transparent;
    }

    .btn-primary:hover { background: #333; }

    .btn-danger {
      color: #c0392b;
      border-color: #f5c6c6;
    }

    .btn-danger:hover { background: #fff5f5; }

    /* forms */
    .form-group { margin-bottom: 1rem; }

    .form-group label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 4px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    textarea,
    select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
      color: #1a1a1a;
      font-family: inherit;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: #999;
    }

    /* django auto-generates <p> tags with as_p */
    form p { margin-bottom: 1rem; }
    form p label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 4px;
    }

    a { color: #1a1a1a; }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
