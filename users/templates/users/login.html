{% extends 'base.html' %}
{% block content %}
<div class="page" style="max-width:400px; margin:0 auto">
  <h1 class="page-title">Log in</h1>
  <div class="card">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary" style="width:100%">Log in</button>
    </form>
  </div>
  <p class="page-subtitle" style="text-align:center">
    No account? <a href="{% url 'signup' %}">Sign up</a>
  </p>
</div>
{% endblock %}
